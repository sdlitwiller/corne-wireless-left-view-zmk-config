# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable the nice!view display and status widgets
# Note: CONFIG_ZMK_WIDGET_LAYER_STATUS, CONFIG_ZMK_WIDGET_OUTPUT_STATUS, and
# CONFIG_ZMK_WIDGET_WPM_STATUS are intentionally omitted here because the
# nice_view shield already includes these widgets in its own status.c. Enabling
# them here causes duplicate symbol linker errors.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# Enable soft-off support so the keyboard can be powered down and then brought
# back on again without a physical power switch.
CONFIG_ZMK_PM_SOFT_OFF=y

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
